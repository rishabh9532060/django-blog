{% extends 'base.html' %}
{% block content %}
  <div class="row">
    {%for i in post%}
    <div class="col-md-4">
      <div class="card" >
   
        <div class="card-body">
          <h5 class="card-title">{{ i.title }}</h5>
          <p class="card-text">{{ i.content }}</p>
          <a href="{% url 'post_detail' i.id %}" class="btn btn-primary">Go somewhere</a>
        </div>
      </div>
    </div>
    {%endfor%}
  </div>
{% endblock %}
